apiVersion: apps/v1
kind: Deployment
metadata:
  name: nodejs-app
spec:
  replicas: '{{ .Values.replicaCount }}'
  selector:
    matchLabels:
      app: nodejs-app

  template:
    metadata:
      labels:
        app: nodejs-app

    spec:
      containers:
        - name: nodejs
          image: "{{ .Values.image }}"
          imagePullPolicy: Always

          ports:
            - containerPort: 3000

